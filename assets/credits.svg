<svg xmlns="http://www.w3.org/2000/svg" width="880" height="32" viewBox="0 0 880 32" role="img" aria-labelledby="t d">
<title id="t">Inspiration</title>
<desc id="d">Credits to Giorgi Kobaidze, who made the original cyberpunk profile console.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#8b949e}.cy{fill:#ff4d6d}.fg{fill:#c9d1d9}.gr{fill:#3fb950}.wh{fill:#f0fbff}
